# CRATE for iPhone — the Xcode project is generated from this file by XcodeGen (see .github/workflows/ios.yml and ios/README.md),
# so there is no .xcodeproj to keep in step by hand.
name: CRATE
options:
  bundleIdPrefix: io.github.tirantbacon23
  deploymentTarget:
    iOS: "15.0"
targets:
  CRATE:
    type: application
    platform: iOS
    sources:
      - path: CRATE
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: CRATE
        CFBundleName: CRATE
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        # Keeps the app (and the music it plays) running with the phone locked or another app open.
        UIBackgroundModes: [audio]
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # Links CRATE hands to other apps (Spotify, YouTube).
        LSApplicationQueriesSchemes: [spotify, youtube]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.tirantbacon23.crate
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
